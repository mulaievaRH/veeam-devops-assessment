name: Build and publish NuGet package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check builder image
        run: |
          IMAGE="ghcr.io/mulaievarh/veeam-build-agent:dotnet8"
          if ! docker buildx imagetools inspect "$IMAGE"; then
            echo "::error::Builder image $IMAGE is not available in GHCR"
            exit 1
          fi

  build-package:
    needs: check-image
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mulaievarh/veeam-build-agent:dotnet8

    defaults:
      run:
        working-directory: task2_pipelines/TestApp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore dependencies
        run: dotnet restore TestApp.sln

      - name: Check NuGet vulnerabilities
        run: dotnet list TestApp.sln package --vulnerable --include-transitive

      - name: Build solution
        run: dotnet build TestApp.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test TestApp.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: task2_pipelines/TestApp/**/TestResults/*.trx
          if-no-files-found: warn

      - name: Pack NuGet package
        run: dotnet pack TestApp/TestApp.csproj --configuration Release --no-build --output ./packages -p:PackageVersion=1.0.${{ github.run_number }}

      - name: Publish NuGet package
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          NUGET_FEED_URL: ${{ secrets.NUGET_FEED_URL }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_FEED_URL" ] || [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NuGet feed credentials are not configured"
            exit 1
          fi

          dotnet nuget push ./packages/*.nupkg \
            --source "$NUGET_FEED_URL" \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

  notify:
    needs: [check-image, build-package]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          IMAGE_CHECK: ${{ needs.check-image.result }}
          BUILD_RESULT: ${{ needs.build-package.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::Slack webhook is not configured"
            exit 0
          fi

          if [ "$IMAGE_CHECK" = "success" ] && [ "$BUILD_RESULT" = "success" ]; then
            STATUS="SUCCESS"
          else
            STATUS="FAILED"
          fi

          export STATUS
          python3 -c 'import json, os; print(json.dumps({"text": "NuGet pipeline: {} | {}".format(os.environ["STATUS"], os.environ["RUN_URL"])}))' > payload.json

          if ! curl --fail --silent --show-error --max-time 15 \
            -X POST \
            -H "Content-Type: application/json" \
            --data-binary @payload.json \
            "$SLACK_WEBHOOK_URL"; then
            echo "::warning::Failed to send Slack notification"
          fi